<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="referrer" content="no-referrer">
    <meta name="robots" content="noindex,nofollow">
    <meta name="description" content="An unfinished backseat journey. Look around, watch the rain, leave a note.">
    <title>drops. - A ride in the rain</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <header class="masthead">
      <a class="wordmark" href="./" aria-label="drops.">drops<span>.</span></a>
      <span class="edition" data-copy="edition">Journey study 09</span>
      <label id="language-control" hidden><span data-copy="language">Language</span>
        <select id="language"><option value="it">Italiano</option><option value="en">English</option></select>
      </label>
    </header>
    <main>
      <section id="entry" class="entry">
        <div id="language-step">
          <p class="eyebrow">A ride in the rain</p>
          <h1><span lang="it">Scegli la lingua.</span><br><span lang="en">Choose your language.</span></h1>
          <div class="entry-actions"><button type="button" data-language="it" lang="it">Italiano</button><button type="button" data-language="en" lang="en">English</button></div>
        </div>
        <div id="intro-step" hidden>
          <p class="eyebrow" data-copy="edition"></p>
          <h1 data-copy="title">A ride in the rain.</h1>
          <p class="premise" data-copy="premise"></p>
          <p data-copy="instructions"></p>
          <p class="scope" data-copy="scope"></p>
          <button id="begin" type="button" data-copy="begin"></button>
        </div>
      </section>
      <div id="app" hidden>
        <div class="study-note"><p data-copy="scope"></p><a href="#feedback-panel" id="feedback-link" data-copy="feedback">Your feedback</a></div>
        <div class="workspace">
          <section class="journey-panel" aria-label="Journey">
            <iframe id="journey" title="Backseat journey" allow="fullscreen" allowfullscreen></iframe>
            <p id="scene-loading" role="status" data-copy="loading"></p>
          </section>
          <aside class="feedback-panel">
            <details id="feedback-panel" open><summary data-copy="feedback"></summary><div id="feedback-fields"></div></details>
          </aside>
        </div>
      </div>
    </main>
    <footer><span data-copy="local">No accounts. Feedback stays in a downloaded file.</span><a href="../CREDITS.txt" data-copy="credits">Credits</a><span class="map-credit"><a href="https://www.openstreetmap.org/copyright">© OpenStreetMap contributors</a> - <a href="../map-data/" data-copy="mapData">Data and changes</a></span></footer>
    <script type="module" src="./main.js"></script>
  </body>
</html>
