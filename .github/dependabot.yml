# Map 9.1: updates once a month, grouped into one proposal per ecosystem, nothing younger than 14 days.
# Options checked in GitHub's "Dependabot options reference" (github/docs, 2026-10-14).
# The CI step "dependency age" (scripts/check-lock-age.ts) also checks every package in the lock file.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      npm-monthly:
        patterns: ['*']
    open-pull-requests-limit: 2
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      actions-monthly:
        patterns: ['*']
    open-pull-requests-limit: 2
